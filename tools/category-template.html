<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{seoTitle}</title>
  <meta name="description" content="{seoDescription}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="{canonical}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nyravi Design Studio">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="{seoTitle}">
  <meta property="og:description" content="{seoDescription}">
  <meta property="og:url" content="{canonical}">
  <meta property="og:image" content="{seoImage}">
  <meta property="og:image:alt" content="{title} by Nyravi Design Studio">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{seoTitle}">
  <meta name="twitter:description" content="{seoDescription}">
  <meta name="twitter:image" content="{seoImage}">
  <meta name="twitter:image:alt" content="{title} by Nyravi Design Studio">
  <script type="application/ld+json">{structuredData}</script>
  <link rel="icon" href="images/favicon.ico">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="{key}">
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="page-hero-bg" style="background-image:url('{image}')"></div>
      <div class="page-hero-content">
        <h1 id="category-title">{title}</h1>
        <p id="category-description">{description}</p>
      </div>
    </section>
    <section class="category-main">
      <div class="container">
        <div class="category-intro">
          <h2>Choose your style</h2>
          <p>Browse our designs and order directly on WhatsApp.</p>
        </div>
        <div id="product-grid" class="product-grid"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
